# ============================================================
# Configuration Nginx — Système de Gestion du Courrier Administratif
# Version : 1.0.0
#
# Architecture : Nginx → Gunicorn (Flask) + Fichiers statiques React
#
# Instructions d'installation :
#   sudo cp nginx.conf /etc/nginx/sites-available/sys-courrier
#   sudo ln -s /etc/nginx/sites-available/sys-courrier /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Pré-requis :
#   - Adapter les chemins (FRONTEND_DIST_PATH, DOMAIN)
#   - Configurer SSL/TLS avec Certbot :
#       sudo certbot --nginx -d votre-domaine.ma
# ============================================================

# ── Tuning global ─────────────────────────────────────────────────────────────
# Décompresser les réponses du backend avant proxy
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml
           application/xml application/xml+rss text/javascript;
gzip_min_length 1024;
gzip_vary on;

# ── Upstream Gunicorn ─────────────────────────────────────────────────────────
upstream backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# ── Rate limiting : protection brute-force sur /login ─────────────────────────
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=60r/m;

# ── Redirection HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name votre-domaine.ma www.votre-domaine.ma;

    # ACME challenge pour Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Serveur HTTPS principal ───────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name votre-domaine.ma www.votre-domaine.ma;

    # ── Certificats SSL (Let's Encrypt / Certbot) ──────────────────────────────
    # Décommenter après exécution de : sudo certbot --nginx -d votre-domaine.ma
    # ssl_certificate     /etc/letsencrypt/live/votre-domaine.ma/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/votre-domaine.ma/privkey.pem;

    # ── Paramètres SSL sécurisés ──────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log  /var/log/nginx/courrier_access.log  combined;
    error_log   /var/log/nginx/courrier_error.log   warn;

    # ── Taille maximale des uploads (doit correspondre à MAX_FILE_SIZE backend) ─
    client_max_body_size 10M;

    # ── En-têtes de sécurité HTTP ──────────────────────────────────────────────
    # HSTS : forcer HTTPS pour 1 an (activer uniquement en production HTTPS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Empêcher l'intégration dans des iframes d'autres sites
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Empêcher le sniffing MIME type
    add_header X-Content-Type-Options "nosniff" always;

    # Politique de référent : ne pas fuiter l'URL interne
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions : restreindre les API navigateur sensibles
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy (adapter selon les besoins du frontend)
    # 'unsafe-inline' nécessaire pour certains frameworks CSS-in-JS (MUI, Emotion)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self';" always;

    # ── Frontend React (fichiers statiques compilés) ───────────────────────────
    # Remplacer /path/to/Front-end/dist par le chemin réel après `npm run build`
    root /path/to/Front-end/dist;
    index index.html;

    # Cache agressif sur les assets Vite (hash dans le nom de fichier)
    location ~* \.(js|css|woff|woff2|ttf|eot|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Images uploadées par les utilisateurs — no-cache (contenu dynamique)
    location ~* \.(png|jpg|jpeg|gif|webp)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # ── Rate limiting login ───────────────────────────────────────────────────
    location = /login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend/login;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Proxy toutes les routes API backend ───────────────────────────────────
    # Pattern global : toutes les routes Flask commencent par ces préfixes.
    location ~* ^/(utilisateurs|divisions|services|courrier_entrant|courrier_sortant|bo|notifications|telechargements|types-courrier|types-tiers|tiers|services-param|divisions-param|documents|export|dashboard|type_tiers) {
        limit_req zone=api_zone burst=20 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Désactiver le buffering pour les téléchargements PDF en streaming
        proxy_buffering off;
    }

    # ── SPA Fallback : toute autre route → index.html (React Router) ──────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Bloquer l'accès aux fichiers sensibles ─────────────────────────────────
    location ~ /\.(env|git|gitignore|py|pyc|sql|log|sh|bak|conf)$ {
        deny all;
        return 404;
    }

    location ~ ^/(uploads|exports)/ {
        # Les fichiers sont servis uniquement via les routes backend protégées
        deny all;
        return 404;
    }
}

